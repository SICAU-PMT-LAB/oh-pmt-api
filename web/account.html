<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 主题必须在首次绘制前落地：跨页跳转（如点账号详情）时样式表还没下载完，
     先按记住的主题刷底色，否则深色模式下会闪一下白屏 -->
<script>
(function () {
  var t = 'light';
  try { t = localStorage.getItem('ohpmt_theme') || 'light'; } catch (e) {}
  var root = document.documentElement;
  root.dataset.theme = t;
  root.style.background = t === 'dark' ? '#111110' : '#fdfcf8';
})();
</script>
<title>账号详情 · oh-pmt-api</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/logo-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/logo-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/logo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  .hero {
    display: grid; grid-template-columns: 1.5fr auto; gap: 26px;
    align-items: start; margin-bottom: 22px;
  }
  .hero .who { display: flex; gap: 14px; align-items: flex-start; }
  .hero .glyph {
    width: 46px; height: 46px; border-radius: 11px; display: grid; place-items: center;
    font-family: var(--serif); font-size: 21px; font-weight: 600; flex: none;
    border: 1px solid var(--prov-color, var(--gold)); color: var(--prov-color, var(--gold));
    background: color-mix(in srgb, var(--prov-color, var(--gold)) 10%, transparent);
  }
  .hero h2 { font-family: var(--serif); font-size: 30px; font-weight: 500; margin: 0 0 3px; }
  .hero .meta { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); line-height: 1.8; }
  .hero .rings { display: flex; gap: 20px; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 28px; }
  .kv { display: flex; justify-content: space-between; gap: 14px; padding: 7px 0;
        border-bottom: 1px dashed var(--rule); font-size: 13px; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--ink-faint); font-family: var(--mono); font-size: 10px;
           letter-spacing: .08em; text-transform: uppercase; }
  .kv .v { text-align: right; font-variant-numeric: tabular-nums; }
  .credit-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden;
                border: 1px solid var(--rule); margin: 12px 0 8px; background: var(--paper-deep); }
  .credit-bar > div { height: 100%; transition: width .9s cubic-bezier(.2,.7,.25,1); }
  .legend-dots { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); }
  .legend-dots .d { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }
  @media (max-width: 940px) {
    .hero { grid-template-columns: 1fr; }
    .detail-grid { grid-template-columns: 1fr; }
  }
  /* 窄屏表格卡片化：与 panel.css 的 table.stack 同一套画法。
     本页只引 ui.css，规则在这里自带一份。 */
  @media (max-width: 44rem) {
    table.stack thead { display: none; }
    table.stack, table.stack > tbody, table.stack > tbody > tr, table.stack > tbody > tr > td {
      display: block;
    }
    table.stack > tbody > tr {
      border: 1px solid var(--rule); border-radius: 9px; background: var(--card);
      padding: 12px 14px; margin-bottom: 10px;
    }
    table.stack > tbody > tr:last-child { margin-bottom: 0; }
    table.stack > tbody > tr > td {
      border: none; padding: 4px 0; white-space: normal; text-align: left;
      display: flex; justify-content: space-between; align-items: center; gap: 14px;
    }
    table.stack > tbody > tr > td::before {
      content: attr(data-label);
      font-family: var(--mono); font-size: 9px; letter-spacing: .1em;
      text-transform: uppercase; color: var(--ink-faint); flex: none;
    }
    table.stack > tbody > tr > td:first-child { display: block; padding-bottom: 8px; }
    table.stack > tbody > tr > td:first-child::before { display: none; }
  }
</style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <circle cx="12" cy="12" r="8.4" opacity=".45"/>
          <circle cx="12" cy="12" r="4.6"/>
          <path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3" opacity=".7"/>
        </svg>
        <h1>oh-pmt-api</h1>
      </div>
      <div class="kicker">账号详情</div>
    </div>
    <nav>
      <a href="/admin#overview"><span class="ico">◈</span>概览</a>
      <a href="/admin#accounts" class="active"><span class="ico">◇</span>账号</a>
      <a href="/admin#members"><span class="ico">◉</span>成员</a>
      <a href="/admin#analytics"><span class="ico">▤</span>数据</a>
    </nav>
    <div class="sidebar-foot">
      <div class="sidebar-row">
        <button type="button" class="theme-icon" title="切换明暗"
                aria-label="切换明暗"></button>
        <a href="#" class="logout-link" id="logout"><span class="ico">⏻</span>退出登录</a>
      </div>
      <div style="margin-top:8px"><a href="/admin#accounts" style="color:var(--gold)">← 返回账号列表</a></div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="empty">正在读取…</div>
  </main>
</div>

<script type="module">
import {
  initTheme, api, toast, esc, fmtInt, fmtCompact, fmtMoney,
  lineChart, barChart, ringChart, hbarList, countUp,
} from '/assets/charts.js';

initTheme();

const ACCOUNT_ID = Number(location.pathname.split('/').filter(Boolean).pop());
let DATA = null, MODELS = [];

async function load() {
  try {
    DATA = await api('/api/accounts/' + ACCOUNT_ID);
    try {
      const s = await api('/api/status');
      MODELS = s.models || [];
    } catch { MODELS = []; }
    render();
  } catch (e) {
    document.getElementById('main').innerHTML =
      `<div class="card"><div class="empty">${esc(e.message)}</div>
       <a class="btn" href="/admin#accounts">返回账号列表</a></div>`;
  }
}

const modelById = id => MODELS.find(m => m.id === id)
  || MODELS.find(m => (m.upstream_keys || []).includes(id))
  || { id, name: id };

const modelName = id => modelById(id).name || id || '未知';

// 凭据有效期从十几分钟到一个月都有，统一按量级换单位
function expiresLabel(seconds) {
  if (!(seconds > 0)) return '已过期，下次调用时续期';
  if (seconds >= 172800) return Math.round(seconds / 86400) + ' 天';
  if (seconds >= 7200) return Math.round(seconds / 3600) + ' 小时';
  return Math.round(seconds / 60) + ' 分钟';
}

function render() {
  const a = DATA;
  const t = a.totals || {};
  const color = a.provider_color || 'var(--gold)';
  document.title = `${a.name || a.email || a.uid} · oh-pmt-api`;
  document.documentElement.style.setProperty('--prov-color', color);

  const pct = a.credits_total > 0
    ? Math.max(0, Math.min(1, a.credits_remaining / a.credits_total)) : 0;
  const usedPct = a.credits_total > 0 ? a.credits_used / a.credits_total : 0;
  // 段内深色表示已用部分，浅色表示剩余；整条按各段占总额的比例铺满
  // 每一段画的是「这一块占全部额度的比例」，段内用深浅表示还剩多少
  const baseShare = a.credits_total > 0 ? a.credits_base_total / a.credits_total : 0;
  const addonShare = a.credits_total > 0 ? a.credits_addon_total / a.credits_total : 0;
  const sharedShare = a.credits_total > 0 ? a.credits_shared_total / a.credits_total : 0;
  const state = !a.enabled ? '<span class="pill off">停用</span>'
    : a.cooldown > 0 ? `<span class="pill warn">冷却 ${a.cooldown}s</span>`
    : '<span class="pill ok"><span class="dot"></span>可用</span>';

  document.getElementById('main').innerHTML = `
    <div class="page-head" style="margin-bottom:16px">
      <div>
        <div class="eyebrow">Account detail</div>
      </div>
      <div style="display:flex;gap:8px">
        <a class="btn small" href="/admin#accounts">← 账号列表</a>
        ${a.supports_checkin
          ? `<button class="small" id="btn-checkin">签到</button>` : ''}
        <button class="small ghost" id="btn-toggle">
          ${a.enabled ? '停用' : '启用'}</button>
        <button class="small ghost" id="btn-del">移除</button>
      </div>
    </div>

    <div class="hero">
      <div class="who">
        <div class="glyph">${esc((a.provider_label || '?').slice(0, 1))}</div>
        <div style="min-width:0">
          <h2>${esc(a.name || a.email || a.uid)}</h2>
          <div class="meta">
            ${esc(a.email) || '未返回邮箱'} · ${esc(a.region_label)}<br>
            UID ${esc(a.uid)} · 接入于 ${new Date(a.created_at * 1000).toLocaleDateString('zh-CN')}
          </div>
          <div style="margin-top:8px">${state}
            ${a.plan_name ? `<span class="pill gold">${esc(a.plan_name)}</span>` : ''}
            ${a.credits_exceeded ? '<span class="pill err">额度耗尽</span>' : ''}
            ${a.credits_total <= 0 ? '<span class="pill off">无可用额度</span>' : ''}
          </div>
        </div>
      </div>
      <div class="rings">
        <div id="ring-credit"></div>
        <div style="min-width:130px">
          <div class="stat"><div class="num-big">
            <span data-count="${a.credits_remaining}" data-dec="1">0</span><small>积分</small></div>
            <div class="lbl">剩余额度</div></div>
          <div class="hint">累计发放 ${fmtCompact(a.credits_total)} · 已用 ${fmtCompact(a.credits_used)}
            ${a.credits_expire_at ? '· ' + new Date(a.credits_expire_at * 1000).toLocaleDateString('zh-CN') + ' 到期' : ''}</div>
        </div>
      </div>
    </div>

    <div class="kpi-grid" style="margin-bottom:22px">
      ${kpi('网关请求', `<span data-count="${t.requests || 0}" data-dec="0">0</span>`,
            `失败 ${fmtInt(t.errors || 0)} 次`)}
      ${kpi('成功率', t.success_rate == null ? '—' : t.success_rate.toFixed(1) + '<small>%</small>',
            `成功 ${fmtInt(t.ok || 0)} 次`)}
      ${kpi('Token', `<span data-count="${t.tokens || 0}" data-dec="0">0</span>`,
            `入 ${fmtCompact(t.prompt_tokens || 0)} · 出 ${fmtCompact(t.completion_tokens || 0)}`)}
      ${kpi('网关记账成本', fmtMoney(t.cost || 0),
            `上游已用 ${fmtCompact(a.credits_used)} 积分`)}
      ${kpi('凭证', `<span class="mono" style="font-size:15px">${esc(a.credential_masked || '—')}</span>`,
            `${esc(a.credential_hint || '')}`)}
    </div>

    <div class="grid-wide-left">
      <div class="chart-card">
        <div class="chart-head">
          <span class="t">近 14 天 · 请求与成本</span>
          <span class="spacer"></span>
          <div class="chart-legend">
            <span class="li"><span class="sw" style="background:var(--gold)"></span>请求</span>
            <span class="li"><span class="sw" style="background:var(--bronze)"></span>成本</span>
          </div>
        </div>
        <div id="det-trend"></div>
      </div>
      <div class="card">
        <h3 class="section">额度构成</h3>
        <div class="credit-bar">
          ${a.credits_base_total > 0 ? `<div style="width:${(baseShare * 100).toFixed(1)}%;
            background:linear-gradient(90deg,var(--rule-strong) ${usedShare(a.credits_base_used, a.credits_base_total)}%,var(--gold) 0)"></div>` : ''}
          ${a.credits_addon_total > 0 ? `<div style="width:${(addonShare * 100).toFixed(1)}%;
            background:linear-gradient(90deg,var(--rule-strong) ${usedShare(a.credits_addon_used, a.credits_addon_total)}%,var(--bronze) 0)"></div>` : ''}
          ${a.credits_shared_total > 0 ? `<div style="width:${(sharedShare * 100).toFixed(1)}%;
            background:var(--ok)"></div>` : ''}
          <div style="flex:1;background:var(--rule-strong)"></div>
        </div>
        ${a.credits_base_total + a.credits_addon_total + a.credits_shared_total > 0 ? '' : `
          <div class="hint" style="margin-top:12px">
            上游还没返回额度构成，点右上角「同步额度」拉一次快照。</div>`}
        <div class="legend-dots">
          ${a.credits_base_total > 0 ? `<span><i class="d" style="background:var(--gold)"></i>
            套餐剩 ${fmtCompact(a.credits_base_remaining)} / ${fmtCompact(a.credits_base_total)}</span>` : ''}
          ${a.credits_addon_total > 0 ? `<span><i class="d" style="background:var(--bronze)"></i>
            赠送剩 ${fmtCompact(a.credits_addon_remaining)} / ${fmtCompact(a.credits_addon_total)}</span>` : ''}
          ${a.credits_shared_total > 0 ? `<span><i class="d" style="background:var(--ok)"></i>
            共享 ${fmtCompact(a.credits_shared_remaining)} / ${fmtCompact(a.credits_shared_total)}</span>` : ''}
        </div>
        <div class="hint" style="margin-top:12px">累计已用
          ${a.credits_total > 0 ? (usedPct * 100).toFixed(1) + '%' : '—'}（总额是累计发放量，含签到累加）·
          ${a.synced_ago == null ? '未同步过'
            : a.synced_ago < 90 ? a.synced_ago + ' 秒前同步'
            : a.synced_ago < 5400 ? Math.round(a.synced_ago / 60) + ' 分钟前同步'
            : Math.round(a.synced_ago / 3600) + ' 小时前同步'}</div>

        <h3 class="section" style="margin-top:20px">凭证</h3>
        <div class="kv"><span class="k">掩码</span>
          <span class="v mono">${esc(a.credential_masked || '—')}</span></div>
        <div class="kv"><span class="k">续期剩余</span>
          <span class="v mono">${expiresLabel(a.expires_in)}</span></div>
        ${a.credential_url ? `<div class="hint">凭证在
          <a href="${esc(a.credential_url)}" target="_blank" rel="noopener"
             style="color:var(--gold)">${esc(a.credential_url)}</a> 管理</div>` : ''}
      </div>
    </div>

    <div class="grid2">
      <div class="chart-card">
        <div class="chart-head"><span class="t">按模型用量 · 累计</span></div>
        <div id="det-models"></div>
      </div>
      <div class="card">
        <h3 class="section">绑定成员</h3>
        ${a.bound_members.length
          ? a.bound_members.map(m => `<div class="kv"><span class="k">成员</span>
              <span class="v">${esc(m)}</span></div>`).join('')
          : '<div class="hint">没有成员把此账号设为优先账号，会走共用池。</div>'}
        <h3 class="section" style="margin-top:18px">此账号可见模型</h3>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          ${a.models.length
            ? a.models.map(m => `<span class="pill">${esc(m.name)}</span>`).join('')
            : '<span class="hint">模型目录还没读到</span>'}
        </div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-head"><span class="t">该账号的按模型明细</span></div>
      <div class="table-wrap"><table id="det-by-model-table" class="stack"></table></div>
    </div>

    <div class="chart-card">
      <div class="chart-head"><span class="t">最近调用</span></div>
      <div class="table-wrap">
        <table class="stack">
          <thead><tr><th>时间</th><th>模型</th><th class="num">积分</th>
            <th class="num">Token</th><th>结果</th></tr></thead>
          <tbody id="det-recent"></tbody>
        </table>
        <div id="recent-more"></div>
      </div>
    </div>
  `;

  document.querySelectorAll('[data-count]').forEach(n =>
    countUp(n, Number(n.dataset.count), { decimals: Number(n.dataset.dec || 0) }));
  requestAnimationFrame(() => document.querySelectorAll('.progress > div[data-w]')
    .forEach(d => { d.style.width = d.dataset.w + '%'; }));

  ringChart(document.getElementById('ring-credit'),
    { value: a.credits_remaining, total: a.credits_total || 1, size: 108, label: 'CREDIT' });

  lineChart(document.getElementById('det-trend'), {
    labels: a.daily.map(d => d.date),
    series: [
      { name: '请求', color: 'var(--gold)', values: a.daily.map(d => d.requests) },
      { name: '成本', color: 'var(--bronze)', values: a.daily.map(d => d.cost) },
    ], area: true, height: 200, yFmt: fmtMoney,
  });

  barChart(document.getElementById('det-models'), {
    labels: a.by_model.map(m => modelName(m.id)),
    values: a.by_model.map(m => m.requests),
    color, height: 190,
  });

  const cols = [
    { label: '模型', fmt: r => modelName(r.id) === r.id
        ? `<span class="mono">${esc(r.id)}</span>`
        : `${esc(modelName(r.id))}<div class="sub">${esc(r.id)}</div>` },
    { label: '请求量', cls: 'num', dl: '请求量', fmt: r => fmtInt(r.requests) },
    { label: '失败', cls: 'num', dl: '失败', fmt: r => fmtInt(r.errors) },
    { label: '成功率', cls: 'num', dl: '成功率', fmt: r => r.requests
        ? `<span class="pill ${(r.ok / r.requests) >= 0.95 ? 'ok' : 'warn'}">${((r.ok / r.requests) * 100).toFixed(1)}%</span>`
        : '<span class="hint">—</span>' },
    { label: 'Token', cls: 'num', dl: 'Token', fmt: r => fmtInt(r.tokens) },
    { label: '成本', cls: 'num', dl: '成本', fmt: r => fmtMoney(r.cost) },
  ];
  const table = document.getElementById('det-by-model-table');
  if (!a.by_model.length) table.innerHTML = '<tbody><tr><td class="empty">这个账号还没有调用记录</td></tr></tbody>';
  else table.innerHTML = `<thead><tr>${cols.map(c =>
      `<th class="${c.cls || ''}">${esc(c.label)}</th>`).join('')}</tr></thead>
    <tbody>${a.by_model.map(r => `<tr>${cols.map(c =>
      `<td class="${c.cls || ''}"${c.dl ? ` data-label="${esc(c.dl)}"` : ''}>${c.fmt(r)}</td>`).join('')}</tr>`).join('')}</tbody>`;

  const body = document.getElementById('det-recent');
  // 摘要页只放最近 12 条，其余点开再看，避免页面拉成几千像素长
  const shown = a.recent.slice(0, 12);
  const rowHtml = r => `<tr>
    <td class="mono" data-label="时间">${new Date(r.created_at * 1000).toLocaleString('zh-CN',
      { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}</td>
    <td data-label="模型">${esc(modelName(r.model))}</td>
    <td class="num" data-label="成本">${fmtMoney(r.cost)}</td>
    <td class="num" data-label="Token">${fmtInt(r.total_tokens)}</td>
    <td data-label="结果">${r.status === 200 ? '<span class="pill ok">成功</span>'
      : `<span class="pill err">${esc(r.error || r.status)}</span>`}</td>
  </tr>`;
  body.innerHTML = shown.length ? shown.map(rowHtml).join('')
    : '<tr><td colspan="5" class="empty">还没有调用记录</td></tr>';
  const more = document.getElementById('recent-more');
  more.innerHTML = a.recent.length > shown.length
    ? `<button class="small ghost" id="btn-more" style="margin-top:12px">
        展开其余 ${a.recent.length - shown.length} 条</button>` : '';
  const btnMore = document.getElementById('btn-more');
  if (btnMore) btnMore.addEventListener('click', () => {
    body.insertAdjacentHTML('beforeend', a.recent.slice(shown.length).map(rowHtml).join(''));
    more.innerHTML = '';
  });

  const ck = document.getElementById('btn-checkin');
  if (ck) ck.addEventListener('click', async () => {
    ck.disabled = true; ck.textContent = '签到中…';
    try {
      const res = await api('/api/accounts/checkin', {
        method: 'POST', body: JSON.stringify({ id: a.id }) });
      const r = (res.results || [])[0];
      toast(r ? r.message : '已签到', r && r.ok ? '' : 'err');
      await load();
    } catch (e) { toast(e.message, 'err'); ck.disabled = false; ck.textContent = '签到'; }
  });
  document.getElementById('btn-toggle').addEventListener('click', async () => {
    try {
      await api('/api/accounts/action', { method: 'POST',
        body: JSON.stringify({ id: a.id, action: a.enabled ? 'disable' : 'enable' }) });
      toast(a.enabled ? '已停用' : '已启用');
      await load();
    } catch (e) { toast(e.message, 'err'); }
  });
  document.getElementById('btn-del').addEventListener('click', async () => {
    if (!confirm('移除这个账号？')) return;
    try {
      await api('/api/accounts/' + a.id, { method: 'DELETE' });
      location.href = '/admin#accounts';
    } catch (e) { toast(e.message, 'err'); }
  });
}

// 已用占比，用于额度构成条的深色段
function usedShare(used, total) {
  if (!total) return 0;
  return Math.min(100, Math.max(0, (Number(used) / Number(total)) * 100)).toFixed(0);
}

function kpi(k, v, d = '') {
  return `<div class="kpi"><div class="k">${esc(k)}</div><div class="v">${v}</div>
    ${d ? `<div class="d">${d}</div>` : ''}</div>`;
}

document.addEventListener('themechange', () => { if (DATA) render(); });

document.getElementById('logout').addEventListener('click', async e => {
  // 退出登录是 <a href="#">，不拦的话会先跳到页首再跳登录页
  e.preventDefault();
  try { await api('/api/logout', { method: 'POST' }); } catch { /* 清 cookie 失败也跳走 */ }
  location.href = '/login';
});
load();
</script>
</body>
</html>
