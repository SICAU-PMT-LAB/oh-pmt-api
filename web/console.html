<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的用量 · oh-pmt-api</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  .quota-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  .quota-card { border: 1px solid var(--rule); border-radius: 10px; padding: 20px 22px;
                background: var(--card); position: relative; overflow: hidden; }
  .quota-card::before {
    content: ""; position: absolute; inset: 0; border-radius: 9px; padding: 1px;
    background: linear-gradient(140deg, var(--gold), transparent 45%, transparent 60%, var(--gold));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; opacity: .5;
  }
  .quota-card .label { font-family: var(--mono); font-size: 9px; letter-spacing: .14em;
                       text-transform: uppercase; color: var(--ink-faint); }
  .quota-card .big { font-family: var(--serif); font-size: 34px; font-weight: 500;
                     line-height: 1.1; margin: 8px 0 3px; font-variant-numeric: tabular-nums; }
  .quota-card .big small { font-size: 14px; color: var(--ink-faint); margin-left: 4px; }
  .quota-card .of { font-size: 12.5px; color: var(--ink-soft); }
  .whoami .name { font-family: var(--serif); font-size: 16px; }
  .whoami { padding: 0 22px 18px; }
  .whoami .sub { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); }
  @media (max-width: 860px) { .quota-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <circle cx="12" cy="12" r="8.4" opacity=".45"/>
          <circle cx="12" cy="12" r="4.6"/>
          <path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3" opacity=".7"/>
        </svg>
        <h1>oh-pmt-api</h1>
      </div>
      <div class="kicker">成员控制台</div>
    </div>
    <div class="whoami">
      <div class="name" id="who-name">—</div>
      <div class="sub" id="who-sub"></div>
    </div>
    <nav id="nav">
      <a href="#usage" data-page="usage" class="active"><span class="ico">◈</span>用量</a>
      <a href="#models" data-page="models"><span class="ico">◇</span>模型</a>
      <a href="#guide" data-page="guide"><span class="ico">⌘</span>接入</a>
      <a href="#" id="logout"><span class="ico">⏻</span>退出登录</a>
    </nav>
    <div class="sidebar-foot">
      <div class="theme-toggle" title="切换明暗">
        <div class="opt on" data-theme-opt="light" title="白底金边">☀</div>
        <div class="opt" data-theme-opt="dark" title="黑底金边">☾</div>
      </div>
    </div>
  </aside>

  <main class="main">

    <section class="page active" id="page-usage">
      <div class="page-head">
        <div>
          <div class="eyebrow">Usage</div>
          <h2>用量</h2>
          <p>你的积分消耗。每日和每周各有独立上限，额度由管理员分配。</p>
        </div>
      </div>
      <div class="quota-grid" id="quota-grid"></div>
      <div class="chart-card">
        <div class="chart-head"><span class="t">近 14 天 · 积分消耗</span>
          <span class="spacer"></span>
          <div class="chart-legend">
            <span class="li"><span class="sw" style="background:var(--gold)"></span>积分</span>
          </div>
        </div>
        <div id="my-chart"></div>
      </div>
      <div class="chart-card">
        <div class="chart-head"><span class="t">按模型用量</span></div>
        <div class="table-wrap"><table id="my-models"></table></div>
      </div>
      <div class="chart-card">
        <div class="chart-head"><span class="t">最近调用</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>时间</th><th>模型</th><th class="num">积分</th>
              <th class="num">Token</th><th>结果</th></tr></thead>
            <tbody id="my-recent"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="page" id="page-models">
      <div class="page-head">
        <div>
          <div class="eyebrow">Models</div>
          <h2>可用模型</h2>
          <p>管理员为你开放的模型。请求其他模型会被拒绝。</p>
        </div>
      </div>
      <div class="card"><div id="model-list"></div></div>
      <div class="card">
        <h3 class="section">密钥与限制</h3>
        <div id="key-info"></div>
      </div>
    </section>

    <section class="page" id="page-guide">
      <div class="page-head">
        <div>
          <div class="eyebrow">Integration</div>
          <h2>接入方式</h2>
          <p>把地址和密钥填进任意 OpenAI 兼容客户端即可。</p>
        </div>
      </div>
      <div class="card gold-edge">
        <h3 class="section">接口地址</h3>
        <div class="keybox" id="api-url">—</div>
        <h3 class="section" style="margin-top:20px">调用示例</h3>
        <div class="keybox" id="curl-example" style="white-space:pre-wrap">—</div>
        <div class="note">密钥等同于账户凭证，不要分享。怀疑泄漏请联系管理员重新生成。</div>
      </div>
    </section>

  </main>
</div>

<script type="module">
import {
  initTheme, esc, fmtInt, fmtCompact, lineChart, hbarList, countUp,
} from '/assets/charts.js';

initTheme();

// 优先用 API Key（SDK 用户直接带 key 访问），否则用登录会话
const params = new URLSearchParams(location.search);
const KEY = params.get('key') || localStorage.getItem('ohpmt_member_key') || '';
if (KEY) localStorage.setItem('ohpmt_member_key', KEY);

let MODEL_NAMES = {};

async function api(path) {
  const headers = KEY ? { Authorization: 'Bearer ' + KEY } : {};
  const res = await fetch(path, { headers, credentials: 'same-origin' });
  if (res.status === 401) {
    location.href = '/login';
    throw new Error('请先登录');
  }
  const text = await res.text();
  let data = {};
  try { data = JSON.parse(text); } catch { data = { error: { message: text } }; }
  if (!res.ok) throw new Error((data.error && data.error.message) || '请求失败');
  return data;
}

function show(page) {
  document.querySelectorAll('#nav a').forEach(a =>
    a.classList.toggle('active', a.dataset.page === page));
  document.querySelectorAll('.page').forEach(p =>
    p.classList.toggle('active', p.id === 'page-' + page));
}
document.querySelectorAll('#nav a[data-page]').forEach(a =>
  a.addEventListener('click', e => { e.preventDefault(); show(a.dataset.page); }));

const modelName = id => MODEL_NAMES[id] || id || '未知';
let DASH = null;

async function load() {
  try {
    const d = await api('/api/me');
    DASH = d;
    MODEL_NAMES = {};
    (d.models || []).forEach(m => { MODEL_NAMES[m.id] = m.name; });

    document.getElementById('who-name').textContent = d.member.name;
    document.getElementById('who-sub').textContent =
      d.member.email || d.member.username || '';
    document.title = d.member.name + ' · oh-pmt-api';

    const q = d.quota;
    const card = (label, used, limit, left) => {
      if (!limit) {
        return `<div class="quota-card">
          <div class="label">${label}</div>
          <div class="big"><span data-count="${used}" data-dec="2">0</span><small>积分</small></div>
          <div class="of">不限上限 · 已用 ${Number(used).toFixed(2)}</div>
        </div>`;
      }
      const pct = Math.min(100, (used / limit) * 100);
      const cls = pct >= 95 ? 'progress err' : pct >= 70 ? 'progress warn' : 'progress';
      return `<div class="quota-card">
        <div class="label">${label}</div>
        <div class="big"><span data-count="${left}" data-dec="2">0</span><small>剩余</small></div>
        <div class="of">已用 ${Number(used).toFixed(2)} / 上限 ${Number(limit).toFixed(1)}</div>
        <div class="${cls}" style="margin-top:12px"><div data-w="${pct.toFixed(1)}"></div></div>
      </div>`;
    };
    document.getElementById('quota-grid').innerHTML =
      card('今日积分', q.used_today, q.limit_daily, q.left_today) +
      card('本周积分', q.used_week, q.limit_weekly, q.left_week);
    document.querySelectorAll('[data-count]').forEach(n =>
      countUp(n, Number(n.dataset.count), { decimals: Number(n.dataset.dec || 0) }));
    requestAnimationFrame(() => document.querySelectorAll('.progress > div[data-w]')
      .forEach(d => { d.style.width = d.dataset.w + '%'; }));

    lineChart(document.getElementById('my-chart'), {
      labels: (d.daily || []).map(x => x.date),
      series: [{ name: '积分', color: 'var(--gold)', values: (d.daily || []).map(x => x.credits) }],
      area: true, height: 200, yFmt: v => Number(v).toFixed(2),
    });

    // 按模型汇总当前可见的数据
    const byModel = {};
    (d.recent || []).forEach(r => {
      const cell = byModel[r.model] = byModel[r.model] ||
        { id: r.model, requests: 0, credits: 0, tokens: 0, ok: 0 };
      cell.requests += 1;
      cell.credits += Number(r.credits || 0);
      cell.tokens += Number(r.total_tokens || 0);
      if (r.status === 200) cell.ok += 1;
    });
    hbarList(document.getElementById('my-models'), {
      rows: Object.values(byModel).sort((a, b) => b.credits - a.credits)
        .map(m => ({ label: modelName(m.id), value: m.credits })),
      fmt: v => v.toFixed(3), unit: ' 积分',
    });

    const body = document.getElementById('my-recent');
    body.innerHTML = (d.recent || []).length ? d.recent.map(r => `<tr>
      <td class="mono">${new Date(r.created_at * 1000).toLocaleString('zh-CN',
        { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}</td>
      <td>${esc(modelName(r.model))}</td>
      <td class="num">${Number(r.credits).toFixed(4)}</td>
      <td class="num">${fmtInt(r.total_tokens)}</td>
      <td>${r.status === 200 ? '<span class="pill ok">成功</span>'
        : `<span class="pill err">${esc(r.error || r.status)}</span>`}</td>
    </tr>`).join('') : '<tr><td colspan="5" class="empty">还没有调用记录</td></tr>';

    document.getElementById('model-list').innerHTML = d.models.length
      ? d.models.map(m => `<div style="display:flex;gap:10px;align-items:baseline;
          padding:6px 0;border-bottom:1px solid var(--rule)">
          <span style="min-width:190px">${esc(m.name)}</span>
          <span class="mono" style="color:var(--ink-faint);font-size:11px">${esc(m.id)}</span>
        </div>`).join('')
      : '<div class="empty">管理员还没有为你开放模型</div>';

    document.getElementById('key-info').innerHTML = `
      ${d.member.username ? `<div class="kv" style="display:flex;justify-content:space-between;padding:6px 0"><span class="hint">登录账号</span><span class="mono">${esc(d.member.username)}</span></div>` : ''}
      ${d.key.value ? `<div class="keybox" style="display:flex;justify-content:space-between;gap:12px;align-items:center">
          <span style="word-break:break-all">${esc(d.key.value)}</span>
          <button class="small copy-btn" data-key="${esc(d.key.value)}" style="flex:none">复制</button></div>`
        : (d.key.prefix ? `<div class="mono">密钥前缀：${esc(d.key.prefix)}…</div>` : '')}
      <div class="hint" style="margin-top:12px">允许的来源 IP：${
        d.key.ip_allowlist ? esc(d.key.ip_allowlist) : '不限制'}</div>
      ${d.preferred_account ? `<div class="hint">优先使用的账号：${esc(d.preferred_account)}</div>` : ''}`;

    const base = location.origin + '/v1/chat/completions';
    const model = d.models.length ? d.models[0].id : 'qfmodel';
    document.getElementById('api-url').textContent = base;
    document.getElementById('curl-example').textContent =
`curl ${base} \\
  -H "Authorization: Bearer ${d.key.value || (d.key.prefix ? d.key.prefix + '...' : '你的密钥')}" \\
  -H "Content-Type: application/json" \\
  -d '{"model":"${model}","messages":[{"role":"user","content":"你好"}]}'`;
  } catch (e) {
    document.getElementById('quota-grid').innerHTML = `<div class="note">${esc(e.message)}</div>`;
  }
}

document.addEventListener('click', e => {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  const text = btn.dataset.key;
  const done = () => {
    const o = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(() => { btn.textContent = o; }, 1400);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => alert(text));
  } else alert(text);
});

document.getElementById('logout').addEventListener('click', async e => {
  e.preventDefault();
  localStorage.removeItem('ohpmt_member_key');
  await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
  location.href = '/login';
});

document.addEventListener('themechange', () => { if (DASH) load(); });

// 地址栏 hash 直达某一页（刷新后停在同一页）
const initial = location.hash.replace('#', '');
if (initial && document.getElementById('page-' + initial)) show(initial);
addEventListener('hashchange', () => {
  const page = location.hash.replace('#', '');
  if (page && document.getElementById('page-' + page)) show(page);
});
load();
</script>
</body>
</html>
