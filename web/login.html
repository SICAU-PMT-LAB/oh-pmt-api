<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · oh-pmt-api</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .box { width: 100%; max-width: 380px; padding: 24px; position: relative; z-index: 1; }
  .mark { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .mark svg { width: 26px; height: 26px; color: var(--gold); }
  .mark .name { font-family: var(--serif); font-size: 22px; font-weight: 500; }
  h1 { font-family: var(--serif); font-size: 30px; font-weight: 500; margin: 0 0 4px; }
  .sub { color: var(--ink-soft); font-size: 13.5px; margin-bottom: 26px; }
  form { animation: rise .5s cubic-bezier(.2,.7,.25,1) both; }
  button[type=submit] { width: 100%; justify-content: center; margin-top: 8px; padding: 10px; }
  .err { color: var(--err); font-size: 13px; margin-top: 14px; min-height: 20px; }
  .theme-toggle { position: fixed; top: 20px; right: 20px; z-index: 2; }
  .rule { display: flex; align-items: center; gap: 12px; margin: 26px 0 0; }
  .rule .line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-line), transparent); }
  .rule svg { width: 14px; height: 14px; color: var(--gold); }
</style>
</head>
<body>
<div class="theme-toggle">
  <div class="opt on" data-theme-opt="light" title="白底金边">☀</div>
  <div class="opt" data-theme-opt="dark" title="黑底金边">☾</div>
</div>

<div class="box">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
      <circle cx="12" cy="12" r="8.4" opacity=".45"/>
      <circle cx="12" cy="12" r="4.6"/>
      <path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3" opacity=".7"/>
    </svg>
    <span class="name">oh-pmt-api</span>
  </div>
  <h1>登录</h1>
  <div class="sub">用管理员分配给你的账号密码登录。</div>
  <form id="f">
    <div class="field">
      <label for="u">账号</label>
      <input id="u" autocomplete="username" placeholder="账号" required>
    </div>
    <div class="field">
      <label for="p">密码</label>
      <input id="p" type="password" autocomplete="current-password" placeholder="密码" required>
    </div>
    <button type="submit" class="primary" id="btn">登录</button>
  </form>
  <div class="err" id="e"></div>
  <div class="rule">
    <span class="line"></span>
    <svg viewBox="0 0 20 20" fill="currentColor">
      <circle cx="10" cy="10" r="2"/><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width=".8"/>
    </svg>
    <span class="line"></span>
  </div>
</div>

<script type="module">
import { initTheme } from '/assets/charts.js';
initTheme();

const f = document.getElementById('f');
const btn = document.getElementById('btn');
const err = document.getElementById('e');

f.addEventListener('submit', async ev => {
  ev.preventDefault();
  const username = document.getElementById('u').value.trim();
  const password = document.getElementById('p').value;
  if (!username || !password) return;
  btn.disabled = true; err.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.ok) {
      location.href = data.redirect || '/me';
      return;
    }
    err.textContent = (data.error && data.error.message) || '登录失败';
    btn.disabled = false;
  } catch (e) {
    err.textContent = '网络错误：' + e.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
