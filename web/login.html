<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>qoder2api · 登录</title>
<style>
  :root {
    --paper: #faf9f5; --ink: #1a1915; --ink-soft: #5c5a54; --ink-faint: #8b887f;
    --rule-strong: #d2cec2; --accent: #c15f3c; --accent-soft: #f5e8e2; --err: #a33b2c;
    --serif: "Tiempos Text", "Copernicus", Charter, "Iowan Old Style",
             "Palatino Linotype", Palatino, Georgia, "Songti SC", "Noto Serif CJK SC", serif;
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink);
    font-family: var(--serif); font-size: 15.5px; line-height: 1.65;
    -webkit-font-smoothing: antialiased; padding: 24px;
  }
  .box { width: 100%; max-width: 360px; }
  .kicker {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-faint); margin-bottom: 8px;
  }
  h1 { font-size: 26px; font-weight: 400; margin: 0 0 28px; letter-spacing: -.015em; }
  label {
    display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-faint); margin-bottom: 6px;
  }
  .field { margin-bottom: 16px; }
  input {
    font-family: var(--serif); font-size: 15px; padding: 10px 12px; width: 100%;
    border: 1px solid var(--rule-strong); border-radius: 6px; background: #fff; color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button {
    font-family: var(--serif); font-size: 14.5px; padding: 10px 18px; width: 100%;
    margin-top: 6px; border-radius: 6px; border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper); cursor: pointer;
  }
  button:hover { background: #000; }
  button:disabled { opacity: .55; cursor: default; }
  .err { color: var(--err); font-size: 13.5px; margin-top: 14px; min-height: 20px; }
</style>
</head>
<body>
<div class="box">
  <div class="kicker">qoder2api</div>
  <h1>登录</h1>
  <form id="f">
    <div class="field">
      <label for="u">账号</label>
      <input id="u" autocomplete="username" placeholder="账号" required>
    </div>
    <div class="field">
      <label for="p">密码</label>
      <input id="p" type="password" autocomplete="current-password" placeholder="密码" required>
    </div>
    <button type="submit" id="btn">登录</button>
  </form>
  <div class="err" id="e"></div>
</div>
<script>
const f = document.getElementById('f');
const btn = document.getElementById('btn');
const err = document.getElementById('e');

f.addEventListener('submit', async ev => {
  ev.preventDefault();
  const username = document.getElementById('u').value.trim();
  const password = document.getElementById('p').value;
  if (!username || !password) return;
  btn.disabled = true; err.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.ok) {
      location.href = data.redirect || '/me';
      return;
    }
    err.textContent = (data.error && data.error.message) || '登录失败';
    btn.disabled = false;
  } catch (e) {
    err.textContent = '网络错误：' + e.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
